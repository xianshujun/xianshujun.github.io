<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="xianshujun 的个人主页：Go 后端开发，做 Agent 开发与交易服务，开源项目 GoStudy。" />
    <meta name="theme-color" content="#23262C" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // 在首帧之前定好主题，避免先渲染浅色再跳深色。默认深色，用户手动选过浅色才跟随用户。
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('homepage-theme');
          theme = saved === 'light' ? 'light' : 'dark';
        } catch (error) { /* 无存储权限时按深色渲染。 */ }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#23262C' : '#F8F7F4');
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/images/avatar.webp" as="image" type="image/webp" />
    <link rel="preconnect" href="https://api.github.com" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>xianshujun — 开发与记录</title>
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
